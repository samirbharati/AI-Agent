[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-backend"
version = "0.1.0"
description = "AgentForge — Multi-Agent AI Software Development Platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "langgraph==0.2.60",
    "langchain-core==0.3.28",
    "ollama==0.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # Use of `assert` — allowed in tests
    "B008",  # Function call in default argument (FastAPI Depends pattern)
    "S603",  # subprocess call — we review these explicitly
    "S607",  # Starting process with partial executable path
    "E501",  # Line length is handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]
markers = [
    "integration: marks tests that require real external services (deselect with '-m not integration')",
    "ollama: marks tests requiring a live Ollama instance",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
