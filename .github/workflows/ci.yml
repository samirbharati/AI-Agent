name: AgentForge CI/CD Pipeline

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend-lint-and-tests:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e ".[dev]"

      - name: Ruff Linting
        run: |
          cd backend
          python -m ruff check app/ tests/

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=xml

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Verification & Vite Build
        run: |
          cd frontend
          npm run build

  security-scans:
    name: Security Scans (Gitleaks & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Semgrep Static Code Analysis
        run: |
          pip install semgrep
          semgrep scan --config auto --severity ERROR backend/

  docker-verification:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build (Dry Run)
        run: |
          if [ -f backend/Dockerfile ]; then
            docker build --check backend/
          else
            echo "No custom Dockerfile found, skipping build check."
          fi
